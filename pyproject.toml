[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zukan"
version = "0.1.0"
description = "YAML → VOICEVOX → ffmpeg の純コード音声/動画生成パイプライン"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.scripts]
zukan = "zukan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["zukan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
