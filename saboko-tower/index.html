<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>さぼこタワー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="head">
      <h1>さぼこタワー</h1>
      <div class="meta">
        <button id="mute" class="mute" type="button" aria-label="音を消す">🔊</button>
        <div class="stat"><span class="label">HEIGHT</span><span id="height">0</span></div>
        <div class="stat"><span class="label">BEST</span><span id="best">0</span></div>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="400" height="640"></canvas>
      <div id="gameover" class="overlay hidden">
        <div class="panel">
          <p class="panel-title">たおれた</p>
          <dl class="result">
            <dt>たかさ</dt><dd><span id="final-height">0</span> cm</dd>
            <dt>つんだ数</dt><dd id="final-count">0</dd>
          </dl>
          <button id="retry" type="button">もう一度</button>
        </div>
      </div>
    </div>

    <p class="hint">左右に動かしてクリック／タップで置く（←→ と スペース でも操作可）</p>
  </div>

  <!-- スイカゲームで作った形データを共用している -->
  <script src="../vendor/matter.min.js"></script>
  <script src="../vendor/poly-decomp.min.js"></script>
  <script src="../assets/shapes.js"></script>
  <!-- tools/build-audio.mjs が生成。無くても合成音で鳴る -->
  <script src="assets/sounds.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
