project_name: sample_manga_short
output_filename: sample_manga_short.mp4

video:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  audio_codec: aac
  video_bitrate: 15M
  audio_bitrate: 192k
  pixel_format: yuv420p
  fit_mode: contain_blur
  background_blur: 20

voicevox:
  engine_url: http://127.0.0.1:50021
  cache: true
  default_speed: 1.15
  default_pitch: 0.0
  default_intonation: 1.05
  default_volume: 1.0
  pre_phoneme_length: 0.05
  post_phoneme_length: 0.12

subtitles:
  enabled: true
  font: Hiragino Sans
  font_size: 70
  max_lines: 2
  max_chars_per_line: 16
  position_y: 1450
  outline_width: 6
  shadow: true
  safe_margin_x: 80
  speaker_colors:
    narrator: white
    male: white
    female: white
    other: white

audio:
  bgm_volume: 0.10
  voice_volume: 1.0
  sfx_volume: 0.35
  normalize: true
  target_lufs: -14
  true_peak: -1.5
  ducking: true
  bgm_fade: 0.8

editing:
  default_motion: zoom_in
  default_zoom_start: 1.00
  default_zoom_end: 1.12
  transition_duration: 0.10
  minimum_scene_duration: 0.8
  maximum_scene_duration: 5.0
  enable_auto_cut: true
  random_seed: 42

branding:
  intro_enabled: false
  outro_enabled: false
  watermark_enabled: false

upload_text:
  title_template: "【自由すぎる職場】の【あまえ上手な先輩】の【意味深なお誘い】がヤバすぎた…!!"
  hashtags:
    - shorts
    - 漫画
    - 漫画紹介
